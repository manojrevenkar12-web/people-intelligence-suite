[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "people-intelligence-suite"
version = "0.1.0"
description = "One trusted view of People data across HiBob, payroll, compensation and Finance; reconciliation, pay equity, Tableau extracts, a self-service assistant and n8n workflows, with GDPR built in."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Manoj Kumar Prakash"}]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "pyyaml>=6", "duckdb>=1.0", "dbt-duckdb>=1.8",
  "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.6", "tableauhyperapi>=0.0.19000",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pis = "pis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pis.assistant" = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["pis"]

[tool.ruff.lint.per-file-ignores]
"src/pis/report.py" = ["E501"]
